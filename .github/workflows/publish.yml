name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

# Releases never overlap; a second tag waits for the running one instead of cancelling it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/main.yml

  release:
    name: Publish
    needs: ci
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: write # GitHub Release
      id-token: write # Open VSX Trusted Publishing
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download the .vsix
        uses: actions/download-artifact@v8.0.2
        with:
          name: manifest-lens-vsix

      - name: Verify the release is consistent
        run: |
          version=$(node -p "require('./package.json').version")
          vsix="$(node -p "require('./package.json').name")-$version.vsix"
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG does not match package.json version $version" >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main" >&2; exit 1; }
          [ -f "$vsix" ] || { echo "$vsix was not built" >&2; exit 1; }

          # The release notes are the changelog section of this version.
          awk -v ver="$version" '
            /^## / { v = $2; gsub(/^\[|\].*$|\(.*$/, "", v); if (found) exit; found = (v == ver); next }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }

          {
            echo ""
            echo "---"
            echo ""
            echo "SHA-256: \`$(sha256sum "$vsix" | cut -d' ' -f1)\`"
            echo ""
            echo "📦 [\`.vsix\` download](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$vsix) · [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=demartini.manifest-lens) · [Open VSX](https://open-vsx.org/extension/demartini/manifest-lens)"
          } >> notes.md
          echo "VSIX=$vsix" >> "$GITHUB_ENV"

      # --skip-duplicate makes re-running a failed release safe.
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@4.0.0 publish --packagePath "$VSIX" --skip-duplicate

      - name: Publish to Open VSX
        run: npx --yes ovsx@1.2.0 publish "$VSIX" --trusted-publishing --skip-duplicate

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum "$VSIX" > "$VSIX.sha256"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" "$VSIX" "$VSIX.sha256" --clobber
          else
            gh release create "$TAG" "$VSIX" "$VSIX.sha256" --verify-tag --title "Manifest Lens $TAG" --notes-file notes.md
          fi
